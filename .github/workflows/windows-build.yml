name: Windows offline application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      INVOICE_RESOURCES: ${{ github.workspace }}/vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Prepare signed offline Word runtime
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - name: Measure complete Office runtime
        run: python scripts/package-footprint.py --root vendor/libreoffice --label office_before --report build/package-footprint.json
      - name: Record Word conversion baseline
        run: python scripts/verify-word-trim.py baseline "${{ runner.temp }}/invoice-word-layout"
      - name: Trim interactive Office resources
        run: python scripts/trim-word-runtime.py vendor/libreoffice build/word-trim.json
      - name: Compare Word rendering after trimming
        run: python scripts/verify-word-trim.py verify "${{ runner.temp }}/invoice-word-layout"
      - name: Measure trimmed Office runtime
        run: python scripts/package-footprint.py --root vendor/libreoffice --label office_after --report build/package-footprint.json
      - name: Verify processing core
        env:
          INVOICE_RESOURCES: ${{ github.workspace }}/vendor
        run: python -m pytest -q
      - name: Build independent Python core
        run: npm run build:core
      - name: Copy app-local VC runtime into core
        shell: pwsh
        run: Copy-Item vendor/vc-runtime/*.dll build/core/invoice-core/_internal
      - name: Measure packaged core
        run: python scripts/package-footprint.py --root build/core/invoice-core --label core --report build/package-footprint.json
      - name: Gather dependency notices
        run: python scripts/collect-licenses.py
      - name: Smoke test bundled dependencies
        run: python scripts/smoke-core.py build/core/invoice-core/invoice-core.exe vendor
      - name: Build desktop ZIP
        run: npm run package:win
      - name: Verify packaged desktop interactions
        env:
          INVOICE_ELECTRON_E2E: '1'
          INVOICE_E2E_PACKAGED: ${{ github.workspace }}/release/win-unpacked/发票整理助手.exe
        run: npm run test:ui -- --project=electron
      - name: Verify final package contents
        shell: pwsh
        run: |
          $base = 'release/win-unpacked/resources'
          if (!(Test-Path "$base/core/invoice-core.exe")) { throw 'Core missing' }
          if (!(Test-Path "$base/libreoffice/program/soffice.exe")) { throw 'LibreOffice missing' }
          if (!(Test-Path "$base/licenses/PaddleOCR-models-Apache-2.0.txt")) { throw 'Model license missing' }
          python scripts/smoke-core.py "$base/core/invoice-core.exe" "$base"
          if ($LASTEXITCODE -ne 0) { throw 'Final core smoke test failed' }
          $zip = (Get-ChildItem release/*.zip | Select-Object -First 1).FullName
          python scripts/package-footprint.py --zip "$zip" --label windows_zip --report build/package-footprint.json
          if ($LASTEXITCODE -ne 0) { throw 'Package inventory failed' }
          Copy-Item build/package-footprint.json,build/word-trim.json release
          Get-FileHash release/*.zip -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceAssistant-Windows-x64
          path: |
            release/*.zip
            release/SHA256.txt
            release/package-footprint.json
            release/word-trim.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
